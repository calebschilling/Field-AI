# Field-AI on the HOST network (same as Aria).
#
#   docker compose up -d --build
#
# Inbox listens on the Tailscale IP:8081 (not LAN). Host 8080 is Leantime.
# Enhancer talks to Aria on that same Tailscale IP:8787.
#
# Persistence: ./data/audio is a bind mount on the HOST disk.

services:
  api:
    image: field-ai
    build: .
    command: python main.py
    network_mode: host
    env_file: .env
    environment:
      AUDIO_DIR: /audio
      PORT: "8081"
      HOST: "100.74.101.82"
    volumes:
      - ./data/audio:/audio
    restart: unless-stopped

  worker:
    image: field-ai
    command: python worker.py
    network_mode: host
    env_file: .env
    environment:
      AUDIO_DIR: /audio
    volumes:
      - ./data/audio:/audio
    restart: unless-stopped

  enhancer:
    image: field-ai
    command: python enhance.py
    network_mode: host
    env_file: .env
    environment:
      AUDIO_DIR: /audio
    volumes:
      - ./data/audio:/audio
    restart: unless-stopped
