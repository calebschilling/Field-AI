<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field AI</title>
  <link rel="icon" href="/assets/glass-ready.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --void: #050505;
      --void-2: #0c0c0e;
      --glass: rgb(255 255 255 / 0.07);
      --glass-2: rgb(255 255 255 / 0.11);
      --glass-edge: rgb(255 255 255 / 0.28);
      --glass-edge-soft: rgb(255 255 255 / 0.12);
      --text: #f4f5f7;
      --muted: #9aa0ab;
      --faint: #6b7280;
      --rose: #ff6b7a;
      --cyan: #7dd3fc;
      --mint: #86efac;
      --amber: #fbbf24;
      --display: "Sora", ui-sans-serif, system-ui, sans-serif;
      --sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
      --glass-shadow:
        0 0 0 1px rgb(255 255 255 / 0.06),
        0 18px 50px rgb(0 0 0 / 0.55),
        inset 0 1px 0 rgb(255 255 255 / 0.22),
        inset 0 -1px 0 rgb(255 255 255 / 0.04);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      background:
        radial-gradient(900px 520px at 12% -8%, rgb(120 160 255 / 0.12), transparent 55%),
        radial-gradient(700px 480px at 92% 8%, rgb(255 90 120 / 0.08), transparent 50%),
        radial-gradient(600px 400px at 70% 100%, rgb(80 220 200 / 0.06), transparent 55%),
        var(--void);
      color: var(--text);
      line-height: 1.5;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .rail {
      background: linear-gradient(180deg, rgb(255 255 255 / 0.03), transparent 70%);
      border-bottom: 1px solid var(--glass-edge-soft);
      padding: 1rem 1.15rem 0.9rem;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
      width: max-content;
    }
    .mark {
      width: 3rem;
      height: 3rem;
      flex-shrink: 0;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgb(0 0 0 / 0.55));
    }
    .brand-copy strong {
      display: block;
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .brand-copy em {
      display: block;
      margin-top: 0.2rem;
      font-style: normal;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    #count {
      display: block;
      margin: 0.7rem 0 0.85rem;
      color: var(--faint);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .search { position: relative; flex: 1 1 12rem; }
    .search input {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-edge-soft);
      border-radius: 999px;
      padding: 0.5rem 0.9rem 0.5rem 2rem;
      outline: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus {
      border-color: var(--glass-edge);
      box-shadow: 0 0 0 3px rgb(125 211 252 / 0.12);
    }
    .search::before {
      content: "";
      position: absolute;
      left: 0.75rem;
      top: 50%;
      width: 0.65rem;
      height: 0.65rem;
      transform: translateY(-50%);
      border: 1.5px solid var(--faint);
      border-radius: 50%;
      pointer-events: none;
    }
    .day-filter {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--glass);
      border: 1px solid var(--glass-edge-soft);
      border-radius: 999px;
      padding: 0.15rem 0.25rem 0.15rem 0.7rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .day-filter label { color: var(--faint); font-size: 0.75rem; }
    .day-filter input[type="date"] {
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 0.28rem 0.4rem;
      color-scheme: dark;
    }
    .ghost, .danger-ghost {
      border-radius: 999px;
      border: 1px solid var(--glass-edge-soft);
      background: var(--glass);
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .ghost:hover { border-color: var(--glass-edge); background: var(--glass-2); }
    .danger-ghost { color: #fda4af; }
    .danger-ghost:hover {
      background: rgb(255 80 100 / 0.14);
      border-color: rgb(255 120 140 / 0.35);
    }
    #index { display: none; }
    main {
      min-width: 0;
      padding: 1.1rem 1.1rem 3rem;
    }
    .day { margin-bottom: 1.6rem; }
    .day-label {
      margin: 0 0 0.65rem 0.15rem;
      font-family: var(--display);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .empty {
      text-align: center;
      padding: 4.5rem 1rem;
    }
    .empty h2 {
      font-family: var(--display);
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
      margin: 0 0 0.4rem;
    }
    .empty p { margin: 0; color: var(--muted); }
    article {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      color: var(--text);
      border-radius: 1.35rem;
      padding: 1.2rem 1.25rem 1.3rem;
      margin-bottom: 0.95rem;
      background:
        linear-gradient(145deg, rgb(255 255 255 / 0.14), rgb(255 255 255 / 0.04) 42%, rgb(180 210 255 / 0.06)),
        var(--glass);
      border: 1px solid var(--glass-edge);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(28px) saturate(1.35);
      -webkit-backdrop-filter: blur(28px) saturate(1.35);
    }
    article::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(120% 80% at 12% 0%, rgb(255 255 255 / 0.28), transparent 42%),
        radial-gradient(90% 70% at 100% 100%, rgb(255 120 180 / 0.08), transparent 50%),
        radial-gradient(80% 60% at 0% 80%, rgb(100 220 255 / 0.08), transparent 45%);
      z-index: 0;
    }
    article::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.08),
        inset 0 12px 28px rgb(255 255 255 / 0.04);
      z-index: 0;
    }
    article > * { position: relative; z-index: 1; }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      align-items: center;
      flex: 1;
      font-size: 0.8rem;
    }
    .when { color: var(--muted); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      background: rgb(255 255 255 / 0.08);
      border: 1px solid rgb(255 255 255 / 0.16);
      color: var(--muted);
    }
    .queued, .review { color: var(--amber); border-color: rgb(251 191 36 / 0.35); background: rgb(251 191 36 / 0.1); }
    .processing { color: var(--cyan); border-color: rgb(125 211 252 / 0.35); background: rgb(125 211 252 / 0.1); }
    .done { color: var(--mint); border-color: rgb(134 239 172 / 0.35); background: rgb(134 239 172 / 0.1); }
    .failed { color: var(--rose); border-color: rgb(255 107 122 / 0.4); background: rgb(255 107 122 / 0.12); }
    .title {
      font-family: var(--display);
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin: 0 0 0.15rem;
    }
    .filename { margin: 0 0 0.8rem; color: var(--faint); font-size: 0.75rem; }
    .icon-delete {
      border: 0;
      background: transparent;
      color: var(--faint);
      padding: 0.1rem 0.25rem;
      font-size: 0.75rem;
    }
    .icon-delete:hover { color: var(--rose); }
    .summary { font-size: 1rem; color: #e8eaef; }
    .summary h2 {
      font-family: var(--display);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b8c0d0;
      margin: 0.95rem 0 0.3rem;
    }
    .summary h2:first-child { margin-top: 0.2rem; }
    .summary h3 { font-size: 0.95rem; margin: 0.7rem 0 0.3rem; color: var(--muted); }
    .summary ul { margin: 0.1rem 0 0.3rem; padding-left: 1.15rem; }
    .summary li { margin: 0.2rem 0; }
    .summary p { margin: 0.25rem 0; }
    .aria-note { margin: 0.9rem 0 0; color: var(--muted); font-size: 0.88rem; }
    .byline { color: var(--faint); font-size: 0.75rem; margin: 0.4rem 0 0; }
    .summary-msg { color: var(--muted); margin: 0.4rem 0; }
    .summary-msg.error { color: var(--rose); }
    details.raw { margin-top: 0.9rem; color: var(--muted); font-size: 0.9rem; }
    details.raw summary {
      cursor: pointer;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .transcript {
      white-space: pre-wrap;
      margin-top: 0.5rem;
      background: rgb(0 0 0 / 0.28);
      border: 1px solid var(--glass-edge-soft);
      border-radius: 0.9rem;
      padding: 0.75rem 0.85rem;
      color: #d7dbe3;
    }
    .error { color: var(--rose); white-space: pre-wrap; margin: 0.4rem 0; }
    .player { margin-top: 1rem; }
    audio { width: 100%; height: 2.2rem; accent-color: #9ec5ff; }
    #deck { display: none; }
    dialog {
      border: 1px solid var(--glass-edge);
      border-radius: 1.25rem;
      background:
        linear-gradient(160deg, rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.05)),
        rgb(12 12 16 / 0.92);
      color: var(--text);
      padding: 1.3rem 1.35rem 1.2rem;
      width: min(22rem, calc(100vw - 2rem));
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.72); }
    dialog p { margin: 0 0 1rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }

    @media (min-width: 980px) {
      .app {
        grid-template-rows: none;
        grid-template-columns: minmax(20rem, 24rem) 1fr;
        height: 100vh;
      }
      .rail {
        border-bottom: 0;
        border-right: 1px solid var(--glass-edge-soft);
        padding: 1.6rem 1.2rem 1.2rem;
        overflow: auto;
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.04), transparent 40%),
          rgb(0 0 0 / 0.35);
      }
      .brand-copy strong { font-size: 1.55rem; }
      .mark { width: 3.5rem; height: 3.5rem; }
      #index {
        display: block;
        margin-top: 1.15rem;
        padding-right: 0.2rem;
      }
      .row {
        display: grid;
        grid-template-columns: 3.4rem 1fr;
        gap: 0.15rem 0.65rem;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 0.9rem;
        padding: 0.55rem 0.7rem;
        margin-bottom: 0.2rem;
        color: #c4c9d4;
      }
      .row:hover {
        background: var(--glass);
        border-color: var(--glass-edge-soft);
      }
      .row.active {
        background: var(--glass-2);
        border-color: var(--glass-edge);
        color: var(--text);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.12);
      }
      .row-time {
        grid-row: 1 / 3;
        align-self: center;
        font-family: var(--display);
        font-size: 0.82rem;
        font-weight: 500;
        color: #a8b4c8;
      }
      .row-title {
        font-size: 0.92rem;
        font-weight: 500;
        line-height: 1.25;
      }
      .row-status {
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .row.active .row-status { color: var(--cyan); }
      main {
        padding: 2.2rem 8vw 3rem;
        overflow: auto;
      }
      #list .day { display: none; }
      #reader article {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 2.1rem 1.9rem;
        border-radius: 1.6rem;
      }
      #reader .title { font-size: 2rem; }
      #reader .summary { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="/">
        <img class="mark" src="/assets/glass-ready.png" alt="" width="56" height="56">
        <span class="brand-copy">
          <strong>Field AI</strong>
          <em>voice notes, clarified</em>
        </span>
      </a>
      <span id="count">loading…</span>
      <div class="tools">
        <div class="search">
          <input type="search" id="q" placeholder="Search notes" autocomplete="off">
        </div>
        <div class="day-filter">
          <label for="day">Day</label>
          <input type="date" id="day">
        </div>
        <button type="button" class="ghost" id="all-days">All days</button>
        <button type="button" class="danger-ghost" id="delete-visible">Delete these</button>
      </div>
      <nav id="index" aria-label="Notes"></nav>
    </aside>
    <main>
      <div id="reader"></div>
      <div id="list"></div>
      <div id="deck"></div>
    </main>
  </div>
  <dialog id="confirm-dialog">
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="danger-ghost" id="confirm-ok">Delete</button>
    </div>
  </dialog>
  <script>
    const list = document.getElementById("list");
    const reader = document.getElementById("reader");
    const deck = document.getElementById("deck");
    const index = document.getElementById("index");
    const count = document.getElementById("count");
    const dayInput = document.getElementById("day");
    const qInput = document.getElementById("q");
    const confirmDialog = document.getElementById("confirm-dialog");
    const confirmMsg = document.getElementById("confirm-msg");
    const cards = new Map();
    const missingWav = new Set();
    let selectedDay = "";
    let selectedQuery = "";
    let selectedId = "";
    let searchTimer = 0;
    let confirmResolve = null;

    function fieldHeaders(init) {
      const headers = new Headers(init);
      if (window.FIELD_KEY) headers.set("X-Field-Key", window.FIELD_KEY);
      return headers;
    }

    function desktop() {
      return window.matchMedia("(min-width: 980px)").matches;
    }

    function fmtNum(n) {
      if (n === null || n === undefined || n === "") return null;
      const x = Number(n);
      return Number.isFinite(x) ? x.toLocaleString() : null;
    }

    function bylineText(job) {
      const model = job.summary_model || "";
      const label = model ? "Noted by " + model : "Noted by AI";
      const out = fmtNum(job.summary_output_tokens);
      return out ? label + " · " + out + " tokens" : label;
    }

    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function fmtWhen(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }

    function dayKey(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "unknown";
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function dayLabel(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "Unknown day";
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      if (sameDay(d, today)) return "Today";
      if (sameDay(d, yesterday)) return "Yesterday";
      return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    }

    function humanName(name) {
      if (!name) return "Recording";
      return name.replace(/\.wav$/i, "").replace(/_/g, " ");
    }

    function extractTitle(job) {
      const md = job.summary || "";
      const lines = md.split("\n");
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].replace(/\s+$/, "");
        const inline = t.match(/^#{1,3}\s*title\s+(.+)/i);
        if (inline) return inline[1].trim();
        if (/^#{1,3}\s*title\s*$/i.test(t)) {
          for (let j = i + 1; j < lines.length; j++) {
            const next = lines[j].trim();
            if (next) return next;
          }
        }
      }
      return humanName(job.original_name || job.id);
    }

    function bodyMarkdown(md) {
      if (!md) return "";
      const lines = md.split("\n");
      let i = 0;
      while (i < lines.length && !lines[i].trim()) i += 1;
      if (i < lines.length && /^#{1,3}\s*title\b/i.test(lines[i].trim())) {
        const t = lines[i].trim();
        i += 1;
        if (!/^#{1,3}\s*title\s+\S/i.test(t)) {
          while (i < lines.length && !lines[i].trim()) i += 1;
          if (i < lines.length) i += 1;
        }
        while (i < lines.length && !lines[i].trim()) i += 1;
      }
      return lines.slice(i).join("\n");
    }

    function phase(job) {
      const status = job.status || "unknown";
      if (status === "queued") return { label: "Queued", cls: "queued" };
      if (status === "processing") return { label: "Transcribing", cls: "processing" };
      if (status === "failed") return { label: "Failed", cls: "failed" };
      const est = job.summary_status || "";
      if (est === "pending" || est === "processing") return { label: "Summarizing", cls: "processing" };
      if (est === "failed") return { label: "Summary failed", cls: "failed" };
      const ast = job.agent_status || "";
      const acted = Boolean((job.agent_note || "").trim());
      if (ast === "pending") return { label: "Ready", cls: "done" };
      if (ast === "claimed" && !acted) return { label: "Aria reviewing", cls: "review" };
      if (ast === "failed") return { label: "Review failed", cls: "failed" };
      if (ast === "done" || (ast === "claimed" && acted)) return { label: "Reviewed", cls: "done" };
      return { label: "Ready", cls: "done" };
    }

    function renderMarkdown(root, md) {
      root.replaceChildren();
      if (!md) return;
      let ul = null;
      for (const line of md.split("\n")) {
        const t = line.replace(/\s+$/, "");
        if (/^#{1,3} /.test(t)) {
          ul = null;
          const depth = t.startsWith("### ") ? 3 : 2;
          const h = document.createElement(depth === 3 ? "h3" : "h2");
          h.textContent = t.replace(/^#+\s*/, "");
          root.append(h);
        } else if (t.startsWith("- ") || t.startsWith("* ")) {
          if (!ul) {
            ul = document.createElement("ul");
            root.append(ul);
          }
          const li = document.createElement("li");
          li.textContent = t.slice(2);
          ul.append(li);
        } else if (t.trim() === "") {
          ul = null;
        } else {
          ul = null;
          const p = document.createElement("p");
          p.textContent = t;
          root.append(p);
        }
      }
    }

    function ensurePlayer(article, job) {
      const slot = article.querySelector(".player");
      if (slot.querySelector("audio")) return;
      if (missingWav.has(job.id)) return;
      const status = job.status || "";
      if (status !== "done" && status !== "failed") return;
      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "none";
      player.addEventListener("error", () => {
        missingWav.add(job.id);
        player.remove();
      });
      fetch("/audio/" + job.id + "/wav", { headers: fieldHeaders() })
        .then((res) => {
          if (!res.ok) throw new Error(String(res.status));
          return res.blob();
        })
        .then((blob) => {
          player.src = URL.createObjectURL(blob);
          slot.append(player);
        })
        .catch(() => {
          missingWav.add(job.id);
        });
    }

    function fillCard(article, job) {
      const status = job.status || "unknown";
      const look = phase(job);
      article.querySelector(".title").textContent = extractTitle(job);
      article.querySelector(".filename").textContent = job.original_name || job.id;
      const badge = article.querySelector(".badge");
      badge.className = "status badge " + look.cls;
      badge.textContent = look.label;
      article.querySelector(".when").textContent = fmtWhen(job.created_at);

      const err = article.querySelector(".wav-error");
      const ariaNote = article.querySelector(".aria-note");
      const byline = article.querySelector(".byline");
      const summary = article.querySelector(".summary");
      const msg = article.querySelector(".summary-msg");
      const raw = article.querySelector("details.raw");
      const transcript = article.querySelector(".transcript");

      if (status === "failed") {
        err.hidden = false;
        err.textContent = job.error || "Failed";
        ariaNote.hidden = true;
        byline.hidden = true;
        summary.hidden = true;
        msg.hidden = true;
        raw.hidden = true;
      } else {
        err.hidden = true;
        const note = job.summary || "";
        const est = job.summary_status || "";
        if (note) {
          summary.hidden = false;
          if (article.dataset.summary !== note) {
            article.dataset.summary = note;
            renderMarkdown(summary, bodyMarkdown(note));
          }
          byline.hidden = false;
          byline.textContent = bylineText(job);
        } else {
          summary.hidden = true;
          summary.replaceChildren();
          article.dataset.summary = "";
          byline.hidden = true;
        }
        const review = (job.agent_note || "").trim();
        if (review) {
          ariaNote.hidden = false;
          ariaNote.textContent = "Aria · " + review;
        } else {
          ariaNote.hidden = true;
          ariaNote.textContent = "";
        }
        if (status === "done" && (est === "pending" || est === "processing")) {
          msg.hidden = false;
          msg.className = "summary-msg";
          msg.textContent = "Writing the note…";
        } else if (est === "failed") {
          msg.hidden = false;
          msg.className = "summary-msg error";
          msg.textContent = job.summary_error || "Summary failed";
        } else {
          msg.hidden = true;
        }
        if (job.transcript) {
          raw.hidden = false;
          transcript.textContent = job.transcript;
        } else {
          raw.hidden = status !== "queued" && status !== "processing";
          transcript.textContent = status === "done" ? "" : "Waiting for transcript…";
        }
      }
      ensurePlayer(article, job);
    }

    function makeCard(job) {
      const article = document.createElement("article");
      article.dataset.id = job.id;
      article.innerHTML =
        '<div class="card-top">' +
          '<div class="meta">' +
            '<span class="status badge"></span>' +
            '<span class="when"></span>' +
          "</div>" +
          '<button type="button" class="icon-delete">Delete</button>' +
        "</div>" +
        '<h2 class="title"></h2>' +
        '<p class="filename"></p>' +
        '<div class="wav-error error" hidden></div>' +
        '<div class="summary" hidden></div>' +
        '<p class="summary-msg" hidden></p>' +
        '<div class="player"></div>' +
        '<p class="aria-note" hidden></p>' +
        '<p class="byline" hidden></p>' +
        '<details class="raw" hidden><summary>Transcript</summary>' +
          '<div class="transcript"></div></details>';
      fillCard(article, job);
      article.querySelector(".icon-delete").addEventListener("click", (e) => {
        e.stopPropagation();
        deleteOneSafe(job.id, extractTitle(job));
      });
      cards.set(job.id, article);
      return article;
    }

    function upsert(job) {
      let article = cards.get(job.id);
      if (!article) article = makeCard(job);
      else fillCard(article, job);
      return article;
    }

    function renderIndex(jobs) {
      const frag = document.createDocumentFragment();
      let currentKey = "";
      for (const job of jobs) {
        const key = dayKey(job.created_at);
        if (key !== currentKey) {
          currentKey = key;
          const h = document.createElement("h2");
          h.className = "day-label";
          h.textContent = dayLabel(job.created_at);
          frag.append(h);
        }
        const look = phase(job);
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row" + (job.id === selectedId ? " active" : "");
        row.dataset.id = job.id;
        row.innerHTML =
          '<span class="row-time"></span>' +
          '<span class="row-title"></span>' +
          '<span class="row-status"></span>';
        row.querySelector(".row-time").textContent = fmtWhen(job.created_at);
        row.querySelector(".row-title").textContent = extractTitle(job);
        row.querySelector(".row-status").textContent = look.label;
        row.addEventListener("click", () => select(job.id));
        frag.append(row);
      }
      index.replaceChildren(frag);
    }

    function select(id) {
      selectedId = id;
      const article = cards.get(id);
      if (!article) return;
      for (const [oid, node] of cards) {
        if (oid !== id) deck.append(node);
      }
      reader.replaceChildren(article);
      for (const row of index.querySelectorAll(".row")) {
        row.classList.toggle("active", row.dataset.id === id);
      }
    }

    function showEmpty() {
      cards.clear();
      selectedId = "";
      index.replaceChildren();
      reader.replaceChildren();
      const copy = emptyCopy();
      const wrap = document.createElement("div");
      wrap.className = "empty";
      const h = document.createElement("h2");
      h.textContent = copy.title;
      const p = document.createElement("p");
      p.textContent = copy.body;
      wrap.append(h, p);
      list.replaceChildren(wrap);
    }

    function askDelete() {
      confirmDialog.showModal();
      return new Promise((resolve) => {
        confirmResolve = resolve;
      });
    }

    function finishConfirm(ok) {
      if (confirmDialog.open) confirmDialog.close();
      if (confirmResolve) {
        const resolve = confirmResolve;
        confirmResolve = null;
        resolve(ok);
      }
    }

    document.getElementById("confirm-ok").addEventListener("click", () => finishConfirm(true));
    document.getElementById("confirm-cancel").addEventListener("click", () => finishConfirm(false));
    confirmDialog.addEventListener("cancel", (e) => {
      e.preventDefault();
      finishConfirm(false);
    });
    confirmDialog.addEventListener("close", () => {
      if (confirmResolve) finishConfirm(false);
    });

    async function removeJob(id) {
      const res = await fetch("/audio/" + id, { method: "DELETE", headers: fieldHeaders() });
      if (!res.ok) {
        window.alert("Could not delete: " + res.status);
        return false;
      }
      const article = cards.get(id);
      if (article) article.remove();
      cards.delete(id);
      if (selectedId === id) selectedId = "";
      pruneEmptyDays();
      setCount(cards.size);
      return true;
    }

    function pruneEmptyDays() {
      for (const day of list.querySelectorAll(".day")) {
        if (!day.querySelector("article")) day.remove();
      }
    }

    function setCount(n) {
      if (selectedQuery) {
        count.textContent = n === 1 ? "1 match" : n + " matches";
        return;
      }
      count.textContent = n === 1 ? "1 note" : n + " notes";
    }

    async function deleteOneSafe(id, label) {
      confirmMsg.replaceChildren("Delete ", Object.assign(document.createElement("strong"), { textContent: label || id }), "? This cannot be undone.");
      const ok = await askDelete();
      if (!ok) return;
      await removeJob(id);
      refresh();
    }

    async function deleteVisible() {
      const ids = [...cards.keys()];
      if (!ids.length) return;
      confirmMsg.replaceChildren(
        "Delete all ",
        Object.assign(document.createElement("strong"), { textContent: String(ids.length) }),
        " visible note(s)? This cannot be undone."
      );
      const ok = await askDelete();
      if (!ok) return;
      for (const id of ids) {
        if (!await removeJob(id)) break;
      }
      refresh();
    }

    function audioUrl() {
      const params = new URLSearchParams();
      if (selectedDay) params.set("created_on", selectedDay);
      if (selectedQuery) params.set("q", selectedQuery);
      const q = params.toString();
      return q ? "/audio?" + q : "/audio";
    }

    function emptyCopy() {
      if (selectedQuery && selectedDay) {
        return { title: "No matches", body: "Nothing on " + selectedDay + " matches “" + selectedQuery + "”." };
      }
      if (selectedQuery) {
        return { title: "No matches", body: "No notes match “" + selectedQuery + "”." };
      }
      if (selectedDay) {
        return { title: "Quiet day", body: "No recordings on " + selectedDay + "." };
      }
      return { title: "Nothing yet", body: "Notes appear here after a recording uploads." };
    }

    async function refresh() {
      try {
        const res = await fetch(audioUrl(), { headers: fieldHeaders() });
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const jobs = await res.json();
        setCount(jobs.length);
        if (!jobs.length) {
          showEmpty();
          return;
        }
        const openIds = new Set();
        for (const [id, article] of cards) {
          const details = article.querySelector("details.raw");
          if (details && details.open) openIds.add(id);
        }
        const seen = new Set();
        const groups = [];
        let current = null;
        for (const job of jobs) {
          seen.add(job.id);
          const key = dayKey(job.created_at);
          if (!current || current.key !== key) {
            current = { key, label: dayLabel(job.created_at), articles: [] };
            groups.push(current);
          }
          const article = upsert(job);
          const details = article.querySelector("details.raw");
          if (details) details.open = openIds.has(job.id);
          current.articles.push(article);
        }
        for (const [id, article] of cards) {
          if (!seen.has(id)) {
            article.remove();
            cards.delete(id);
            if (selectedId === id) selectedId = "";
          }
        }
        if (desktop()) {
          list.replaceChildren();
          if (!selectedId || !cards.has(selectedId)) selectedId = jobs[0].id;
          renderIndex(jobs);
          select(selectedId);
        } else {
          reader.replaceChildren();
          selectedId = "";
          const frag = document.createDocumentFragment();
          for (const group of groups) {
            const section = document.createElement("section");
            section.className = "day";
            const heading = document.createElement("h2");
            heading.className = "day-label";
            heading.textContent = group.label;
            section.append(heading, ...group.articles);
            frag.append(section);
          }
          list.replaceChildren(frag);
        }
      } catch (err) {
        count.textContent = "could not load";
      }
    }

    dayInput.addEventListener("change", () => {
      selectedDay = dayInput.value || "";
      refresh();
    });
    document.getElementById("all-days").addEventListener("click", () => {
      dayInput.value = "";
      selectedDay = "";
      refresh();
    });
    qInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        selectedQuery = qInput.value.trim();
        refresh();
      }, 250);
    });
    document.getElementById("delete-visible").addEventListener("click", () => {
      deleteVisible();
    });
    window.matchMedia("(min-width: 980px)").addEventListener("change", () => refresh());

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
