<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1410'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23c4844a' stroke-width='2'/%3E%3Cpath d='M14 36c8-10 12 6 18-4 6-10 10 6 18-3' fill='none' stroke='%23f3ead6' stroke-width='2'/%3E%3Ccircle cx='42' cy='22' r='3' fill='%23c4844a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --walnut: #1a1410;
      --walnut-2: #241c16;
      --line: #3a2f26;
      --cream: #f3ead6;
      --cream-2: #e8dcc4;
      --ink: #2a2218;
      --ink-soft: #5c5146;
      --copper: #c4844a;
      --copper-soft: #e0b07a;
      --moss: #6e8b5c;
      --sky: #6a94b0;
      --rose: #c45c4a;
      --sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      --serif: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--walnut);
      color: var(--cream);
      line-height: 1.5;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .rail {
      background:
        radial-gradient(500px 220px at 0 -40px, #3a2a1c, transparent 70%),
        var(--walnut);
      border-bottom: 1px solid var(--line);
      padding: 1rem 1.15rem 0.9rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
      width: max-content;
    }
    .mark {
      width: 2.6rem;
      height: 2.6rem;
      flex-shrink: 0;
      color: var(--copper);
    }
    .brand-copy strong {
      display: block;
      font-family: var(--serif);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      line-height: 0.9;
      text-transform: uppercase;
    }
    .brand-copy em {
      display: block;
      margin-top: 0.18rem;
      font-style: italic;
      font-family: var(--serif);
      font-size: 0.95rem;
      color: var(--copper-soft);
      letter-spacing: 0.04em;
    }
    #count {
      display: block;
      margin: 0.65rem 0 0.8rem;
      color: #9a8b7a;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .search { position: relative; flex: 1 1 12rem; }
    .search input {
      width: 100%;
      background: var(--walnut-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.45rem 0.85rem 0.45rem 2rem;
      outline: none;
    }
    .search input:focus { border-color: var(--copper); }
    .search::before {
      content: "";
      position: absolute;
      left: 0.7rem;
      top: 50%;
      width: 0.65rem;
      height: 0.65rem;
      transform: translateY(-50%);
      border: 1.5px solid #9a8b7a;
      border-radius: 50%;
      pointer-events: none;
    }
    .day-filter {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--walnut-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.15rem 0.25rem 0.15rem 0.7rem;
    }
    .day-filter label { color: #9a8b7a; font-size: 0.75rem; }
    .day-filter input[type="date"] {
      background: transparent;
      border: 0;
      color: var(--cream);
      padding: 0.28rem 0.4rem;
    }
    .ghost, .danger-ghost {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--walnut-2);
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }
    .ghost:hover { border-color: var(--copper); }
    .danger-ghost { color: #e8a39a; }
    .danger-ghost:hover { background: color-mix(in srgb, var(--rose) 16%, var(--walnut-2)); }
    #index { display: none; }
    main {
      min-width: 0;
      padding: 1.1rem 1.1rem 3rem;
    }
    .day { margin-bottom: 1.6rem; }
    .day-label {
      margin: 0 0 0.55rem 0.1rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9a8b7a;
    }
    .empty {
      text-align: center;
      padding: 4.5rem 1rem;
      color: var(--ink-soft);
    }
    .empty h2 {
      font-family: var(--serif);
      font-size: 2.2rem;
      font-weight: 500;
      font-style: italic;
      color: var(--cream);
      margin: 0 0 0.35rem;
    }
    .empty p { margin: 0; color: #9a8b7a; }
    article {
      background: var(--cream);
      color: var(--ink);
      border-radius: 8px 22px 8px 22px;
      padding: 1.15rem 1.2rem 1.25rem;
      margin-bottom: 0.85rem;
      box-shadow: 0 10px 28px rgb(0 0 0 / 0.22);
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 0.45rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      align-items: center;
      flex: 1;
      font-size: 0.8rem;
    }
    .when { color: var(--ink-soft); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.18rem 0.48rem;
      border-radius: 3px;
      border: 1px solid currentColor;
    }
    .queued, .review { color: #9a6230; }
    .processing { color: #3d6f88; }
    .done { color: #4d6d3d; }
    .failed { color: var(--rose); }
    .title {
      font-family: var(--serif);
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 0.15rem;
    }
    .filename { margin: 0 0 0.75rem; color: #8a7b6a; font-size: 0.75rem; }
    .icon-delete {
      border: 0;
      background: transparent;
      color: #8a7b6a;
      padding: 0.1rem 0.25rem;
      font-size: 0.75rem;
    }
    .icon-delete:hover { color: var(--rose); }
    .summary { font-size: 1.02rem; }
    .summary h2 {
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--copper);
      margin: 0.95rem 0 0.3rem;
    }
    .summary h2:first-child { margin-top: 0.2rem; }
    .summary h3 { font-size: 0.95rem; margin: 0.7rem 0 0.3rem; color: var(--ink-soft); }
    .summary ul { margin: 0.1rem 0 0.3rem; padding-left: 1.15rem; }
    .summary li { margin: 0.2rem 0; }
    .summary p { margin: 0.25rem 0; }
    .aria-note { margin: 0.9rem 0 0; color: #6d5e4f; font-size: 0.88rem; }
    .byline { color: #8a7b6a; font-size: 0.75rem; margin: 0.4rem 0 0; }
    .summary-msg { color: var(--ink-soft); margin: 0.4rem 0; }
    .summary-msg.error { color: var(--rose); }
    details.raw { margin-top: 0.9rem; color: var(--ink-soft); font-size: 0.9rem; }
    details.raw summary {
      cursor: pointer;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .transcript {
      white-space: pre-wrap;
      margin-top: 0.5rem;
      background: var(--cream-2);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      color: var(--ink);
    }
    .error { color: var(--rose); white-space: pre-wrap; margin: 0.4rem 0; }
    .player { margin-top: 1rem; }
    audio { width: 100%; height: 2.2rem; accent-color: var(--copper); }
    #deck { display: none; }
    dialog {
      border: 0;
      border-radius: 8px 22px 8px 22px;
      background: var(--cream);
      color: var(--ink);
      padding: 1.3rem 1.35rem 1.2rem;
      width: min(22rem, calc(100vw - 2rem));
    }
    dialog::backdrop { background: rgb(20 14 10 / 0.62); }
    dialog p { margin: 0 0 1rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
    .dialog-actions .ghost, .dialog-actions .danger-ghost {
      background: var(--cream-2);
      color: var(--ink);
      border-color: #d5c6ae;
    }
    .dialog-actions .danger-ghost { color: var(--rose); }

    @media (min-width: 980px) {
      .app {
        grid-template-rows: none;
        grid-template-columns: minmax(20rem, 24rem) 1fr;
        height: 100vh;
      }
      .rail {
        border-bottom: 0;
        border-right: 1px solid var(--line);
        padding: 1.6rem 1.2rem 1.2rem;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .brand-copy strong { font-size: 2.15rem; letter-spacing: 0.18em; }
      .mark { width: 3.1rem; height: 3.1rem; }
      #index {
        display: block;
        margin-top: 1.15rem;
        padding-right: 0.2rem;
      }
      .row {
        display: grid;
        grid-template-columns: 3.4rem 1fr;
        gap: 0.15rem 0.65rem;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-left: 2px solid transparent;
        border-radius: 0 10px 10px 0;
        padding: 0.55rem 0.65rem;
        margin-bottom: 0.15rem;
        color: #d8cbb8;
      }
      .row:hover { background: var(--walnut-2); }
      .row.active {
        background: var(--walnut-2);
        border-left-color: var(--copper);
        color: var(--cream);
      }
      .row-time {
        grid-row: 1 / 3;
        align-self: center;
        font-family: var(--serif);
        font-style: italic;
        font-size: 0.95rem;
        color: var(--copper-soft);
      }
      .row-title {
        font-size: 0.92rem;
        font-weight: 500;
        line-height: 1.25;
      }
      .row-status {
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9a8b7a;
      }
      .row.active .row-status { color: var(--copper-soft); }
      main {
        padding: 2.2rem 8vw 3rem;
        overflow: auto;
        background:
          radial-gradient(900px 420px at 80% -10%, #3a2a1c, transparent 55%),
          var(--walnut);
      }
      #list .day { display: none; }
      #reader article {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.1rem 2.2rem 2rem;
        border-radius: 6px 28px 8px 28px;
        background:
          linear-gradient(180deg, #f7f0e0, var(--cream) 40%);
        box-shadow:
          0 1px 0 #fff6e6 inset,
          0 18px 50px rgb(0 0 0 / 0.28);
      }
      #reader .title { font-size: 2.35rem; font-style: italic; }
      #reader .summary { font-size: 1.08rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="32" cy="32" r="23.5" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1.8 2.6"/>
          <path d="M12 38c8-11 13 7 20-5 7-12 11 8 20-4" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="43" cy="22" r="3.2" fill="currentColor"/>
        </svg>
        <span class="brand-copy">
          <strong>Field</strong>
          <em>notes from the day</em>
        </span>
      </a>
      <span id="count">loading…</span>
      <div class="tools">
        <div class="search">
          <input type="search" id="q" placeholder="Search the desk" autocomplete="off">
        </div>
        <div class="day-filter">
          <label for="day">Day</label>
          <input type="date" id="day">
        </div>
        <button type="button" class="ghost" id="all-days">All days</button>
        <button type="button" class="danger-ghost" id="delete-visible">Delete these</button>
      </div>
      <nav id="index" aria-label="Notes"></nav>
    </aside>
    <main>
      <div id="reader"></div>
      <div id="list"></div>
      <div id="deck"></div>
    </main>
  </div>
  <dialog id="confirm-dialog">
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="danger-ghost" id="confirm-ok">Delete</button>
    </div>
  </dialog>
  <script>
    const list = document.getElementById("list");
    const reader = document.getElementById("reader");
    const deck = document.getElementById("deck");
    const index = document.getElementById("index");
    const count = document.getElementById("count");
    const dayInput = document.getElementById("day");
    const qInput = document.getElementById("q");
    const confirmDialog = document.getElementById("confirm-dialog");
    const confirmMsg = document.getElementById("confirm-msg");
    const cards = new Map();
    const missingWav = new Set();
    let selectedDay = "";
    let selectedQuery = "";
    let selectedId = "";
    let searchTimer = 0;
    let confirmResolve = null;

    function desktop() {
      return window.matchMedia("(min-width: 980px)").matches;
    }

    function fmtNum(n) {
      if (n === null || n === undefined || n === "") return null;
      const x = Number(n);
      return Number.isFinite(x) ? x.toLocaleString() : null;
    }

    function bylineText(job) {
      const model = job.summary_model || "";
      const label = model ? "Noted by " + model : "Noted by AI";
      const out = fmtNum(job.summary_output_tokens);
      return out ? label + " · " + out + " tokens" : label;
    }

    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function fmtWhen(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }

    function dayKey(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "unknown";
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function dayLabel(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "Unknown day";
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      if (sameDay(d, today)) return "Today";
      if (sameDay(d, yesterday)) return "Yesterday";
      return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    }

    function humanName(name) {
      if (!name) return "Recording";
      return name.replace(/\.wav$/i, "").replace(/_/g, " ");
    }

    function extractTitle(job) {
      const md = job.summary || "";
      const lines = md.split("\n");
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].replace(/\s+$/, "");
        const inline = t.match(/^#{1,3}\s*title\s+(.+)/i);
        if (inline) return inline[1].trim();
        if (/^#{1,3}\s*title\s*$/i.test(t)) {
          for (let j = i + 1; j < lines.length; j++) {
            const next = lines[j].trim();
            if (next) return next;
          }
        }
      }
      return humanName(job.original_name || job.id);
    }

    function bodyMarkdown(md) {
      if (!md) return "";
      const lines = md.split("\n");
      let i = 0;
      while (i < lines.length && !lines[i].trim()) i += 1;
      if (i < lines.length && /^#{1,3}\s*title\b/i.test(lines[i].trim())) {
        const t = lines[i].trim();
        i += 1;
        if (!/^#{1,3}\s*title\s+\S/i.test(t)) {
          while (i < lines.length && !lines[i].trim()) i += 1;
          if (i < lines.length) i += 1;
        }
        while (i < lines.length && !lines[i].trim()) i += 1;
      }
      return lines.slice(i).join("\n");
    }

    function phase(job) {
      const status = job.status || "unknown";
      if (status === "queued") return { label: "Queued", cls: "queued" };
      if (status === "processing") return { label: "Transcribing", cls: "processing" };
      if (status === "failed") return { label: "Failed", cls: "failed" };
      const est = job.summary_status || "";
      if (est === "pending" || est === "processing") return { label: "Summarizing", cls: "processing" };
      if (est === "failed") return { label: "Summary failed", cls: "failed" };
      const ast = job.agent_status || "";
      const acted = Boolean((job.agent_note || "").trim());
      if (ast === "pending") return { label: "Ready", cls: "done" };
      if (ast === "claimed" && !acted) return { label: "Aria reviewing", cls: "review" };
      if (ast === "failed") return { label: "Review failed", cls: "failed" };
      if (ast === "done" || (ast === "claimed" && acted)) return { label: "Reviewed", cls: "done" };
      return { label: "Ready", cls: "done" };
    }

    function renderMarkdown(root, md) {
      root.replaceChildren();
      if (!md) return;
      let ul = null;
      for (const line of md.split("\n")) {
        const t = line.replace(/\s+$/, "");
        if (/^#{1,3} /.test(t)) {
          ul = null;
          const depth = t.startsWith("### ") ? 3 : 2;
          const h = document.createElement(depth === 3 ? "h3" : "h2");
          h.textContent = t.replace(/^#+\s*/, "");
          root.append(h);
        } else if (t.startsWith("- ") || t.startsWith("* ")) {
          if (!ul) {
            ul = document.createElement("ul");
            root.append(ul);
          }
          const li = document.createElement("li");
          li.textContent = t.slice(2);
          ul.append(li);
        } else if (t.trim() === "") {
          ul = null;
        } else {
          ul = null;
          const p = document.createElement("p");
          p.textContent = t;
          root.append(p);
        }
      }
    }

    function ensurePlayer(article, job) {
      const slot = article.querySelector(".player");
      if (slot.querySelector("audio")) return;
      if (missingWav.has(job.id)) return;
      const status = job.status || "";
      if (status !== "done" && status !== "failed") return;
      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "none";
      player.src = "/audio/" + job.id + "/wav";
      player.addEventListener("error", () => {
        missingWav.add(job.id);
        player.remove();
      });
      slot.append(player);
    }

    function fillCard(article, job) {
      const status = job.status || "unknown";
      const look = phase(job);
      article.querySelector(".title").textContent = extractTitle(job);
      article.querySelector(".filename").textContent = job.original_name || job.id;
      const badge = article.querySelector(".badge");
      badge.className = "status badge " + look.cls;
      badge.textContent = look.label;
      article.querySelector(".when").textContent = fmtWhen(job.created_at);

      const err = article.querySelector(".wav-error");
      const ariaNote = article.querySelector(".aria-note");
      const byline = article.querySelector(".byline");
      const summary = article.querySelector(".summary");
      const msg = article.querySelector(".summary-msg");
      const raw = article.querySelector("details.raw");
      const transcript = article.querySelector(".transcript");

      if (status === "failed") {
        err.hidden = false;
        err.textContent = job.error || "Failed";
        ariaNote.hidden = true;
        byline.hidden = true;
        summary.hidden = true;
        msg.hidden = true;
        raw.hidden = true;
      } else {
        err.hidden = true;
        const note = job.summary || "";
        const est = job.summary_status || "";
        if (note) {
          summary.hidden = false;
          if (article.dataset.summary !== note) {
            article.dataset.summary = note;
            renderMarkdown(summary, bodyMarkdown(note));
          }
          byline.hidden = false;
          byline.textContent = bylineText(job);
        } else {
          summary.hidden = true;
          summary.replaceChildren();
          article.dataset.summary = "";
          byline.hidden = true;
        }
        const review = (job.agent_note || "").trim();
        if (review) {
          ariaNote.hidden = false;
          ariaNote.textContent = "Aria · " + review;
        } else {
          ariaNote.hidden = true;
          ariaNote.textContent = "";
        }
        if (status === "done" && (est === "pending" || est === "processing")) {
          msg.hidden = false;
          msg.className = "summary-msg";
          msg.textContent = "Writing the note…";
        } else if (est === "failed") {
          msg.hidden = false;
          msg.className = "summary-msg error";
          msg.textContent = job.summary_error || "Summary failed";
        } else {
          msg.hidden = true;
        }
        if (job.transcript) {
          raw.hidden = false;
          transcript.textContent = job.transcript;
        } else {
          raw.hidden = status !== "queued" && status !== "processing";
          transcript.textContent = status === "done" ? "" : "Waiting for transcript…";
        }
      }
      ensurePlayer(article, job);
    }

    function makeCard(job) {
      const article = document.createElement("article");
      article.dataset.id = job.id;
      article.innerHTML =
        '<div class="card-top">' +
          '<div class="meta">' +
            '<span class="status badge"></span>' +
            '<span class="when"></span>' +
          "</div>" +
          '<button type="button" class="icon-delete">Delete</button>' +
        "</div>" +
        '<h2 class="title"></h2>' +
        '<p class="filename"></p>' +
        '<div class="wav-error error" hidden></div>' +
        '<div class="summary" hidden></div>' +
        '<p class="summary-msg" hidden></p>' +
        '<div class="player"></div>' +
        '<p class="aria-note" hidden></p>' +
        '<p class="byline" hidden></p>' +
        '<details class="raw" hidden><summary>Transcript</summary>' +
          '<div class="transcript"></div></details>';
      fillCard(article, job);
      article.querySelector(".icon-delete").addEventListener("click", (e) => {
        e.stopPropagation();
        deleteOneSafe(job.id, extractTitle(job));
      });
      cards.set(job.id, article);
      return article;
    }

    function upsert(job) {
      let article = cards.get(job.id);
      if (!article) article = makeCard(job);
      else fillCard(article, job);
      return article;
    }

    function renderIndex(jobs) {
      const frag = document.createDocumentFragment();
      let currentKey = "";
      for (const job of jobs) {
        const key = dayKey(job.created_at);
        if (key !== currentKey) {
          currentKey = key;
          const h = document.createElement("h2");
          h.className = "day-label";
          h.textContent = dayLabel(job.created_at);
          frag.append(h);
        }
        const look = phase(job);
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row" + (job.id === selectedId ? " active" : "");
        row.dataset.id = job.id;
        row.innerHTML =
          '<span class="row-time"></span>' +
          '<span class="row-title"></span>' +
          '<span class="row-status"></span>';
        row.querySelector(".row-time").textContent = fmtWhen(job.created_at);
        row.querySelector(".row-title").textContent = extractTitle(job);
        row.querySelector(".row-status").textContent = look.label;
        row.addEventListener("click", () => select(job.id));
        frag.append(row);
      }
      index.replaceChildren(frag);
    }

    function select(id) {
      selectedId = id;
      const article = cards.get(id);
      if (!article) return;
      for (const [oid, node] of cards) {
        if (oid !== id) deck.append(node);
      }
      reader.replaceChildren(article);
      for (const row of index.querySelectorAll(".row")) {
        row.classList.toggle("active", row.dataset.id === id);
      }
    }

    function showEmpty() {
      cards.clear();
      selectedId = "";
      index.replaceChildren();
      reader.replaceChildren();
      const copy = emptyCopy();
      const wrap = document.createElement("div");
      wrap.className = "empty";
      const h = document.createElement("h2");
      h.textContent = copy.title;
      const p = document.createElement("p");
      p.textContent = copy.body;
      wrap.append(h, p);
      list.replaceChildren(wrap);
    }

    function askDelete() {
      confirmDialog.showModal();
      return new Promise((resolve) => {
        confirmResolve = resolve;
      });
    }

    function finishConfirm(ok) {
      if (confirmDialog.open) confirmDialog.close();
      if (confirmResolve) {
        const resolve = confirmResolve;
        confirmResolve = null;
        resolve(ok);
      }
    }

    document.getElementById("confirm-ok").addEventListener("click", () => finishConfirm(true));
    document.getElementById("confirm-cancel").addEventListener("click", () => finishConfirm(false));
    confirmDialog.addEventListener("cancel", (e) => {
      e.preventDefault();
      finishConfirm(false);
    });
    confirmDialog.addEventListener("close", () => {
      if (confirmResolve) finishConfirm(false);
    });

    async function removeJob(id) {
      const res = await fetch("/audio/" + id, { method: "DELETE" });
      if (!res.ok) {
        window.alert("Could not delete: " + res.status);
        return false;
      }
      const article = cards.get(id);
      if (article) article.remove();
      cards.delete(id);
      if (selectedId === id) selectedId = "";
      pruneEmptyDays();
      setCount(cards.size);
      return true;
    }

    function pruneEmptyDays() {
      for (const day of list.querySelectorAll(".day")) {
        if (!day.querySelector("article")) day.remove();
      }
    }

    function setCount(n) {
      if (selectedQuery) {
        count.textContent = n === 1 ? "1 match" : n + " matches";
        return;
      }
      count.textContent = n === 1 ? "1 note on the desk" : n + " notes on the desk";
    }

    async function deleteOneSafe(id, label) {
      confirmMsg.replaceChildren("Delete ", Object.assign(document.createElement("strong"), { textContent: label || id }), "? This cannot be undone.");
      const ok = await askDelete();
      if (!ok) return;
      await removeJob(id);
      refresh();
    }

    async function deleteVisible() {
      const ids = [...cards.keys()];
      if (!ids.length) return;
      confirmMsg.replaceChildren(
        "Delete all ",
        Object.assign(document.createElement("strong"), { textContent: String(ids.length) }),
        " visible note(s)? This cannot be undone."
      );
      const ok = await askDelete();
      if (!ok) return;
      for (const id of ids) {
        if (!await removeJob(id)) break;
      }
      refresh();
    }

    function audioUrl() {
      const params = new URLSearchParams();
      if (selectedDay) params.set("created_on", selectedDay);
      if (selectedQuery) params.set("q", selectedQuery);
      const q = params.toString();
      return q ? "/audio?" + q : "/audio";
    }

    function emptyCopy() {
      if (selectedQuery && selectedDay) {
        return { title: "A blank page", body: "No notes on " + selectedDay + " match “" + selectedQuery + "”." };
      }
      if (selectedQuery) {
        return { title: "Nothing in the stack", body: "No notes match “" + selectedQuery + "”." };
      }
      if (selectedDay) {
        return { title: "A quiet day", body: "No recordings on " + selectedDay + "." };
      }
      return { title: "The desk is clear", body: "Recordings land here after a wav is uploaded." };
    }

    async function refresh() {
      try {
        const res = await fetch(audioUrl());
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const jobs = await res.json();
        setCount(jobs.length);
        if (!jobs.length) {
          showEmpty();
          return;
        }
        const openIds = new Set();
        for (const [id, article] of cards) {
          const details = article.querySelector("details.raw");
          if (details && details.open) openIds.add(id);
        }
        const seen = new Set();
        const groups = [];
        let current = null;
        for (const job of jobs) {
          seen.add(job.id);
          const key = dayKey(job.created_at);
          if (!current || current.key !== key) {
            current = { key, label: dayLabel(job.created_at), articles: [] };
            groups.push(current);
          }
          const article = upsert(job);
          const details = article.querySelector("details.raw");
          if (details) details.open = openIds.has(job.id);
          current.articles.push(article);
        }
        for (const [id, article] of cards) {
          if (!seen.has(id)) {
            article.remove();
            cards.delete(id);
            if (selectedId === id) selectedId = "";
          }
        }
        if (desktop()) {
          list.replaceChildren();
          if (!selectedId || !cards.has(selectedId)) selectedId = jobs[0].id;
          renderIndex(jobs);
          select(selectedId);
        } else {
          reader.replaceChildren();
          selectedId = "";
          const frag = document.createDocumentFragment();
          for (const group of groups) {
            const section = document.createElement("section");
            section.className = "day";
            const heading = document.createElement("h2");
            heading.className = "day-label";
            heading.textContent = group.label;
            section.append(heading, ...group.articles);
            frag.append(section);
          }
          list.replaceChildren(frag);
        }
      } catch (err) {
        count.textContent = "could not load";
      }
    }

    dayInput.addEventListener("change", () => {
      selectedDay = dayInput.value || "";
      refresh();
    });
    document.getElementById("all-days").addEventListener("click", () => {
      dayInput.value = "";
      selectedDay = "";
      refresh();
    });
    qInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        selectedQuery = qInput.value.trim();
        refresh();
      }, 250);
    });
    document.getElementById("delete-visible").addEventListener("click", () => {
      deleteVisible();
    });
    window.matchMedia("(min-width: 980px)").addEventListener("change", () => refresh());

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
