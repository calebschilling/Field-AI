<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,650;1,9..144,560&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d100c;
      --bg-glow: #1a2316;
      --card: #171c14;
      --card-hover: #1c2218;
      --line: #2a3224;
      --text: #ecefe4;
      --muted: #8d9680;
      --faint: #5e6654;
      --gold: #d4b36a;
      --queued: #d4b36a;
      --processing: #7eb4d6;
      --done: #8fba6a;
      --failed: #d46a6a;
      --review: #c9a06a;
      --radius: 16px;
      --header-h: 4.25rem;
      --sans: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
      --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      background:
        radial-gradient(900px 420px at 50% -80px, var(--bg-glow), transparent 70%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      padding: 0.85rem 1.35rem;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      min-width: 6.5rem;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.45rem;
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand h1 em {
      font-style: italic;
      font-weight: 560;
      color: var(--gold);
    }
    #count {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }
    .search {
      position: relative;
    }
    .search input {
      width: min(18rem, 72vw);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.42rem 0.9rem 0.42rem 2rem;
      outline: none;
    }
    .search input:focus {
      border-color: color-mix(in srgb, var(--gold) 55%, var(--line));
    }
    .search::before {
      content: "";
      position: absolute;
      left: 0.7rem;
      top: 50%;
      width: 0.7rem;
      height: 0.7rem;
      transform: translateY(-50%);
      border: 1.5px solid var(--muted);
      border-radius: 50%;
      pointer-events: none;
    }
    .day-filter {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.15rem 0.2rem 0.15rem 0.7rem;
    }
    .day-filter label {
      color: var(--muted);
      font-size: 0.78rem;
    }
    .day-filter input[type="date"] {
      background: transparent;
      color: var(--text);
      border: 0;
      padding: 0.28rem 0.35rem;
    }
    .ghost, .danger-ghost {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: 0.4rem 0.8rem;
      font-size: 0.82rem;
    }
    .ghost:hover { background: var(--card-hover); }
    .danger-ghost {
      color: color-mix(in srgb, var(--failed) 80%, var(--text));
      border-color: color-mix(in srgb, var(--failed) 35%, var(--line));
    }
    .danger-ghost:hover {
      background: color-mix(in srgb, var(--failed) 12%, var(--card));
    }
    main { max-width: 40rem; margin: 0 auto; padding: 1.4rem 1.15rem 4rem; }
    .day { margin-bottom: 1.75rem; }
    .day-label {
      margin: 0 0 0.7rem 0.15rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .empty {
      text-align: center;
      padding: 5rem 1rem;
    }
    .empty h2 {
      font-family: var(--serif);
      font-weight: 560;
      font-size: 1.6rem;
      margin: 0 0 0.4rem;
    }
    .empty p { margin: 0; color: var(--muted); }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.05rem 1.15rem 1.15rem;
      margin-bottom: 0.7rem;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    article:hover {
      background: var(--card-hover);
      border-color: color-mix(in srgb, var(--gold) 18%, var(--line));
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 0.55rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      align-items: center;
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
    }
    .when { color: var(--muted); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, currentColor 40%, var(--line));
      background: color-mix(in srgb, currentColor 10%, transparent);
    }
    .status::before {
      content: "";
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      background: currentColor;
    }
    .queued, .review { color: var(--queued); }
    .processing { color: var(--processing); }
    .done { color: var(--done); }
    .failed { color: var(--failed); }
    .title {
      font-family: var(--serif);
      font-size: 1.28rem;
      font-weight: 560;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 0 0 0.2rem;
    }
    .filename {
      margin: 0 0 0.7rem;
      color: var(--faint);
      font-size: 0.78rem;
    }
    .icon-delete {
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--faint);
      padding: 0.15rem 0.25rem;
      border-radius: 8px;
      font-size: 0.78rem;
    }
    .icon-delete:hover {
      color: var(--failed);
      background: color-mix(in srgb, var(--failed) 10%, transparent);
    }
    .summary { font-size: 0.98rem; }
    .summary h2 {
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.9rem 0 0.3rem;
    }
    .summary h2:first-child { margin-top: 0.15rem; }
    .summary h3 {
      font-size: 0.92rem;
      margin: 0.7rem 0 0.3rem;
      color: var(--muted);
    }
    .summary ul { margin: 0.15rem 0 0.35rem; padding-left: 1.15rem; }
    .summary li { margin: 0.18rem 0; }
    .summary p { margin: 0.25rem 0; }
    .aria-note {
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .byline { color: var(--faint); font-size: 0.78rem; margin: 0.45rem 0 0; }
    .summary-msg { color: var(--muted); font-size: 0.92rem; margin: 0.4rem 0 0.2rem; }
    .summary-msg.error { color: var(--failed); }
    details.raw {
      margin-top: 0.85rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    details.raw summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .transcript {
      white-space: pre-wrap;
      margin-top: 0.5rem;
      color: var(--text);
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
    }
    .error { color: var(--failed); white-space: pre-wrap; margin: 0.4rem 0; }
    .player { margin-top: 0.95rem; }
    audio {
      width: 100%;
      height: 2.25rem;
      accent-color: var(--gold);
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      padding: 1.25rem 1.3rem 1.15rem;
      width: min(22rem, calc(100vw - 2rem));
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.55); }
    dialog p { margin: 0 0 1rem; line-height: 1.4; }
    dialog p strong { font-weight: 700; }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .dialog-actions .danger-ghost { background: color-mix(in srgb, var(--failed) 14%, var(--card)); }
    @media (max-width: 720px) {
      header { padding: 0.75rem 1rem; }
      .tools { width: 100%; margin-left: 0; }
      .search, .search input { width: 100%; }
      .title { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Field<em>.</em></h1>
      <span id="count">loading…</span>
    </div>
    <div class="tools">
      <div class="search">
        <input type="search" id="q" placeholder="Search notes" autocomplete="off">
      </div>
      <div class="day-filter">
        <label for="day">Day</label>
        <input type="date" id="day">
      </div>
      <button type="button" class="ghost" id="all-days">All days</button>
      <button type="button" class="danger-ghost" id="delete-visible">Delete these</button>
    </div>
  </header>
  <main id="list"></main>
  <dialog id="confirm-dialog">
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="confirm-cancel">Cancel</button>
      <button type="button" class="danger-ghost" id="confirm-ok">Delete</button>
    </div>
  </dialog>
  <script>
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const dayInput = document.getElementById("day");
    const qInput = document.getElementById("q");
    const confirmDialog = document.getElementById("confirm-dialog");
    const confirmMsg = document.getElementById("confirm-msg");
    const cards = new Map();
    const missingWav = new Set();
    let selectedDay = "";
    let selectedQuery = "";
    let searchTimer = 0;
    let confirmResolve = null;

    function fmtNum(n) {
      if (n === null || n === undefined || n === "") return null;
      const x = Number(n);
      return Number.isFinite(x) ? x.toLocaleString() : null;
    }

    function bylineText(job) {
      const model = job.summary_model || "";
      const label = model ? "Noted by " + model : "Noted by AI";
      const out = fmtNum(job.summary_output_tokens);
      return out ? label + " · " + out + " tokens" : label;
    }

    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function fmtWhen(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }

    function dayKey(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "unknown";
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function dayLabel(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "Unknown day";
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      if (sameDay(d, today)) return "Today";
      if (sameDay(d, yesterday)) return "Yesterday";
      return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    }

    function humanName(name) {
      if (!name) return "Recording";
      return name.replace(/\.wav$/i, "").replace(/_/g, " ");
    }

    function extractTitle(job) {
      const md = job.summary || "";
      const lines = md.split("\n");
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].replace(/\s+$/, "");
        const inline = t.match(/^#{1,3}\s*title\s+(.+)/i);
        if (inline) return inline[1].trim();
        if (/^#{1,3}\s*title\s*$/i.test(t)) {
          for (let j = i + 1; j < lines.length; j++) {
            const next = lines[j].trim();
            if (next) return next;
          }
        }
      }
      return humanName(job.original_name || job.id);
    }

    function bodyMarkdown(md) {
      if (!md) return "";
      const lines = md.split("\n");
      let i = 0;
      while (i < lines.length && !lines[i].trim()) i += 1;
      if (i < lines.length && /^#{1,3}\s*title\b/i.test(lines[i].trim())) {
        const t = lines[i].trim();
        i += 1;
        if (!/^#{1,3}\s*title\s+\S/i.test(t)) {
          while (i < lines.length && !lines[i].trim()) i += 1;
          if (i < lines.length) i += 1;
        }
        while (i < lines.length && !lines[i].trim()) i += 1;
      }
      return lines.slice(i).join("\n");
    }

    function phase(job) {
      const status = job.status || "unknown";
      if (status === "queued") return { label: "Queued", cls: "queued" };
      if (status === "processing") return { label: "Transcribing", cls: "processing" };
      if (status === "failed") return { label: "Failed", cls: "failed" };
      const est = job.summary_status || "";
      if (est === "pending" || est === "processing") return { label: "Summarizing", cls: "processing" };
      if (est === "failed") return { label: "Summary failed", cls: "failed" };
      const ast = job.agent_status || "";
      const acted = Boolean((job.agent_note || "").trim());
      if (ast === "pending") return { label: "Ready", cls: "done" };
      if (ast === "claimed" && !acted) return { label: "Aria reviewing", cls: "review" };
      if (ast === "failed") return { label: "Review failed", cls: "failed" };
      if (ast === "done" || (ast === "claimed" && acted)) return { label: "Reviewed", cls: "done" };
      return { label: "Ready", cls: "done" };
    }

    function renderMarkdown(root, md) {
      root.replaceChildren();
      if (!md) return;
      let ul = null;
      for (const line of md.split("\n")) {
        const t = line.replace(/\s+$/, "");
        if (/^#{1,3} /.test(t)) {
          ul = null;
          const depth = t.startsWith("### ") ? 3 : 2;
          const h = document.createElement(depth === 3 ? "h3" : "h2");
          h.textContent = t.replace(/^#+\s*/, "");
          root.append(h);
        } else if (t.startsWith("- ") || t.startsWith("* ")) {
          if (!ul) {
            ul = document.createElement("ul");
            root.append(ul);
          }
          const li = document.createElement("li");
          li.textContent = t.slice(2);
          ul.append(li);
        } else if (t.trim() === "") {
          ul = null;
        } else {
          ul = null;
          const p = document.createElement("p");
          p.textContent = t;
          root.append(p);
        }
      }
    }

    function ensurePlayer(article, job) {
      const slot = article.querySelector(".player");
      if (slot.querySelector("audio")) return;
      if (missingWav.has(job.id)) return;
      const status = job.status || "";
      if (status !== "done" && status !== "failed") return;
      const player = document.createElement("audio");
      player.controls = true;
      player.preload = "none";
      player.src = "/audio/" + job.id + "/wav";
      player.addEventListener("error", () => {
        missingWav.add(job.id);
        player.remove();
      });
      slot.append(player);
    }

    function fillCard(article, job) {
      const status = job.status || "unknown";
      const look = phase(job);
      article.querySelector(".title").textContent = extractTitle(job);
      article.querySelector(".filename").textContent = job.original_name || job.id;
      const badge = article.querySelector(".badge");
      badge.className = "status badge " + look.cls;
      badge.textContent = look.label;
      article.querySelector(".when").textContent = fmtWhen(job.created_at);

      const err = article.querySelector(".wav-error");
      const ariaNote = article.querySelector(".aria-note");
      const byline = article.querySelector(".byline");
      const summary = article.querySelector(".summary");
      const msg = article.querySelector(".summary-msg");
      const raw = article.querySelector("details.raw");
      const transcript = article.querySelector(".transcript");

      if (status === "failed") {
        err.hidden = false;
        err.textContent = job.error || "Failed";
        ariaNote.hidden = true;
        byline.hidden = true;
        summary.hidden = true;
        msg.hidden = true;
        raw.hidden = true;
      } else {
        err.hidden = true;
        const note = job.summary || "";
        const est = job.summary_status || "";
        if (note) {
          summary.hidden = false;
          if (article.dataset.summary !== note) {
            article.dataset.summary = note;
            renderMarkdown(summary, bodyMarkdown(note));
          }
          byline.hidden = false;
          byline.textContent = bylineText(job);
        } else {
          summary.hidden = true;
          summary.replaceChildren();
          article.dataset.summary = "";
          byline.hidden = true;
        }
        const review = (job.agent_note || "").trim();
        if (review) {
          ariaNote.hidden = false;
          ariaNote.textContent = "Aria · " + review;
        } else {
          ariaNote.hidden = true;
          ariaNote.textContent = "";
        }
        if (status === "done" && (est === "pending" || est === "processing")) {
          msg.hidden = false;
          msg.className = "summary-msg";
          msg.textContent = "Writing the note…";
        } else if (est === "failed") {
          msg.hidden = false;
          msg.className = "summary-msg error";
          msg.textContent = job.summary_error || "Summary failed";
        } else {
          msg.hidden = true;
        }
        if (job.transcript) {
          raw.hidden = false;
          transcript.textContent = job.transcript;
        } else {
          raw.hidden = status !== "queued" && status !== "processing";
          transcript.textContent = status === "done" ? "" : "Waiting for transcript…";
        }
      }
      ensurePlayer(article, job);
    }

    function makeCard(job) {
      const article = document.createElement("article");
      article.dataset.id = job.id;
      article.innerHTML =
        '<div class="card-top">' +
          '<div class="meta">' +
            '<span class="status badge"></span>' +
            '<span class="when"></span>' +
          "</div>" +
          '<button type="button" class="icon-delete">Delete</button>' +
        "</div>" +
        '<h2 class="title"></h2>' +
        '<p class="filename"></p>' +
        '<div class="wav-error error" hidden></div>' +
        '<div class="summary" hidden></div>' +
        '<p class="summary-msg" hidden></p>' +
        '<div class="player"></div>' +
        '<p class="aria-note" hidden></p>' +
        '<p class="byline" hidden></p>' +
        '<details class="raw" hidden><summary>Transcript</summary>' +
          '<div class="transcript"></div></details>';
      fillCard(article, job);
      article.querySelector(".icon-delete").addEventListener("click", () => {
        deleteOneSafe(job.id, extractTitle(job));
      });
      cards.set(job.id, article);
      return article;
    }

    function upsert(job) {
      let article = cards.get(job.id);
      if (!article) article = makeCard(job);
      else fillCard(article, job);
      return article;
    }

    function askDelete() {
      confirmDialog.showModal();
      return new Promise((resolve) => {
        confirmResolve = resolve;
      });
    }

    function finishConfirm(ok) {
      if (confirmDialog.open) confirmDialog.close();
      if (confirmResolve) {
        const resolve = confirmResolve;
        confirmResolve = null;
        resolve(ok);
      }
    }

    document.getElementById("confirm-ok").addEventListener("click", () => finishConfirm(true));
    document.getElementById("confirm-cancel").addEventListener("click", () => finishConfirm(false));
    confirmDialog.addEventListener("cancel", (e) => {
      e.preventDefault();
      finishConfirm(false);
    });
    confirmDialog.addEventListener("close", () => {
      if (confirmResolve) finishConfirm(false);
    });

    async function removeJob(id) {
      const res = await fetch("/audio/" + id, { method: "DELETE" });
      if (!res.ok) {
        window.alert("Could not delete: " + res.status);
        return false;
      }
      const article = cards.get(id);
      if (article) article.remove();
      cards.delete(id);
      pruneEmptyDays();
      setCount(cards.size);
      return true;
    }

    function pruneEmptyDays() {
      for (const day of list.querySelectorAll(".day")) {
        if (!day.querySelector("article")) day.remove();
      }
    }

    function setCount(n) {
      if (selectedQuery) {
        count.textContent = n === 1 ? "1 match" : n + " matches";
        return;
      }
      count.textContent = n === 1 ? "1 note" : n + " notes";
    }

    async function deleteOneSafe(id, label) {
      confirmMsg.replaceChildren("Delete ", Object.assign(document.createElement("strong"), { textContent: label || id }), "? This cannot be undone.");
      const ok = await askDelete();
      if (!ok) return;
      await removeJob(id);
    }

    async function deleteVisible() {
      const ids = [...cards.keys()];
      if (!ids.length) return;
      confirmMsg.replaceChildren(
        "Delete all ",
        Object.assign(document.createElement("strong"), { textContent: String(ids.length) }),
        " visible note(s)? This cannot be undone."
      );
      const ok = await askDelete();
      if (!ok) return;
      for (const id of ids) {
        if (!await removeJob(id)) break;
      }
    }

    function audioUrl() {
      const params = new URLSearchParams();
      if (selectedDay) params.set("created_on", selectedDay);
      if (selectedQuery) params.set("q", selectedQuery);
      const q = params.toString();
      return q ? "/audio?" + q : "/audio";
    }

    function emptyCopy() {
      if (selectedQuery && selectedDay) {
        return { title: "Nothing here", body: "No notes on " + selectedDay + " match “" + selectedQuery + "”." };
      }
      if (selectedQuery) {
        return { title: "Nothing matches", body: "No notes match “" + selectedQuery + "”." };
      }
      if (selectedDay) {
        return { title: "A quiet day", body: "No recordings on " + selectedDay + "." };
      }
      return { title: "No notes yet", body: "Recordings show up here after a wav is uploaded." };
    }

    async function refresh() {
      try {
        const res = await fetch(audioUrl());
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const jobs = await res.json();
        setCount(jobs.length);
        if (!jobs.length) {
          cards.clear();
          const copy = emptyCopy();
          const wrap = document.createElement("div");
          wrap.className = "empty";
          const h = document.createElement("h2");
          h.textContent = copy.title;
          const p = document.createElement("p");
          p.textContent = copy.body;
          wrap.append(h, p);
          list.replaceChildren(wrap);
          return;
        }
        const openIds = new Set();
        for (const [id, article] of cards) {
          const details = article.querySelector("details.raw");
          if (details && details.open) openIds.add(id);
        }
        const seen = new Set();
        const groups = [];
        let current = null;
        for (const job of jobs) {
          seen.add(job.id);
          const key = dayKey(job.created_at);
          if (!current || current.key !== key) {
            current = { key, label: dayLabel(job.created_at), articles: [] };
            groups.push(current);
          }
          const article = upsert(job);
          const details = article.querySelector("details.raw");
          if (details) details.open = openIds.has(job.id);
          current.articles.push(article);
        }
        for (const [id, article] of cards) {
          if (!seen.has(id)) {
            article.remove();
            cards.delete(id);
          }
        }
        const frag = document.createDocumentFragment();
        for (const group of groups) {
          const section = document.createElement("section");
          section.className = "day";
          const heading = document.createElement("h2");
          heading.className = "day-label";
          heading.textContent = group.label;
          section.append(heading, ...group.articles);
          frag.append(section);
        }
        list.replaceChildren(frag);
      } catch (err) {
        count.textContent = "could not load";
      }
    }

    dayInput.addEventListener("change", () => {
      selectedDay = dayInput.value || "";
      refresh();
    });
    document.getElementById("all-days").addEventListener("click", () => {
      dayInput.value = "";
      selectedDay = "";
      refresh();
    });
    qInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        selectedQuery = qInput.value.trim();
        refresh();
      }, 250);
    });
    document.getElementById("delete-visible").addEventListener("click", () => {
      deleteVisible();
    });

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
